<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#F5F5F0;font-family:Georgia,'Times New Roman',serif;color:#1A1A1A;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px}

/* ── SETUP ── */

.setup input{width:100%;border:2px solid #E0DDD8;border-radius:8px;padding:14px 16px;font-size:18px;text-align:center;background:#fff;outline:none;margin-bottom:12px;letter-spacing:3px;text-transform:uppercase}

.setup .btn-green{width:100%;background:#2D7A4F;border:none;border-radius:8px;padding:15px;color:#fff;font-size:15px;font-weight:bold;margin-bottom:16px}

.setup .step p{font-size:13px;color:#6B6B6B;margin-top:6px;line-height:1.5}
.setup .step a{color:#2D7A4F}
.toggle-setup{background:none;border:none;color:#2D7A4F;font-size:13px;margin-top:8px;text-decoration:underline}

/* ── HEADER ── */
.header{background:#fff;border-bottom:1px solid #E0DDD8;padding:18px 18px 12px;position:sticky;top:0;z-index:50}
.header-row{display:flex;justify-content:space-between;align-items:flex-start}

.mini-label{font-size:9px;color:#9B9B9B;letter-spacing:1px;margin-bottom:4px}
.mini-val{font-size:15px;font-weight:bold}
.divider{border:none;border-top:1px solid #EDEBE6;margin:8px 0}

/* ── CAT ROWS ── */
.cat-row{padding:9px 0;border-bottom:1px solid #EDEBE6;display:flex;align-items:center;justify-content:space-between}

/* ── COOP ── */

/* ── FAB ── */
.fab{position:fixed;bottom:88px;right:20px;z-index:100;width:54px;height:54px;border-radius:50%;background:#2D7A4F;border:none;color:#fff;font-size:26px;box-shadow:0 4px 16px rgba(45,122,79,.45);display:flex;align-items:center;justify-content:center}

/* ── OVERLAY ── */

.monto-wrap{position:relative;margin-bottom:11px}

.err{color:#B83232;font-size:12px;margin-bottom:8px}
.btn-save{width:100%;border:none;border-radius:7px;padding:14px;color:#fff;font-size:15px;font-weight:bold;font-family:Georgia;margin-top:4px}
.btn-red{background:#B83232}
.btn-green{background:#2D7A4F}
.btn-gray{background:#6B6B6B}
.edit-banner{background:#EBF5EE;border:1px solid #A8D5B8;border-radius:6px;padding:8px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#2D7A4F}

/* ── TIPS ── */
.tip-card{border-radius:8px;padding:13px 15px;margin-bottom:10px}
.tip-red{background:#FBEAEA;border:1px solid #E8BBBB}
.tip-amber{background:#FDF3E7;border:1px solid #DEBA8A}
.tip-green{background:#EBF5EE;border:1px solid #A8D5B8}
.tip-blue{background:#EAF0F8;border:1px solid #B8D0E8}
.tip-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;font-weight:bold}
.tip-red .tip-head{color:#B83232}
.tip-amber .tip-head{color:#A0622A}
.tip-green .tip-head{color:#2D7A4F}
.tip-blue .tip-head{color:#1B4F8A}
.tip-msg{font-size:12px;color:#6B6B6B;line-height:1.6}

/* ── NAV ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #E0DDD8;display:flex;z-index:100}
.nav-btn{flex:1;background:none;border:none;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:Georgia;cursor:pointer;border-top:2px solid transparent;transition:color .2s}
.nav-btn.on{color:#2D7A4F;border-top-color:#2D7A4F}
.nav-btn.off{color:#9B9B9B}
.nav-icon{font-size:19px}
.nav-label{font-size:10px;font-weight:bold}

/* ── TOAST ── */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:9px 22px;border-radius:6px;font-size:13px;font-weight:bold;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.15);transition:opacity .3s}
.toast-ok{background:#1A1A1A;color:#fff}
.toast-green{background:#2D7A4F;color:#fff}
.toast-red{background:#B83232;color:#fff}

/* ── WEEK CARD ── */
.week-sem{background:#fff;border:1px solid #E0DDD8;border-radius:8px;padding:13px;margin-bottom:8px}
.week-sem-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.hidden{display:none}
</style>

<script>
// ════════════════════════════════════════════════════════════
// 1. SUPABASE CONFIG — PEGA TUS DATOS AQUÍ
// ════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://zwlzzyinwpkwatbfaipy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bHp6eWlud3Brd2F0YmZhaXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NDM3NzYsImV4cCI6MjA5NjAxOTc3Nn0.vkqIXNfabqFZkfveJhADHHrXoVBSY5_hmiB-86agNk0';

// ════════════════════════════════════════════════════════════
// 2. DATOS DE MANUEL
// ════════════════════════════════════════════════════════════
const S_MES       = 4.33;
const ING_SEM     = 643;
const META_SEM    = 821;
const DEUDA_TOTAL = 14000;
const COOP_SEM    = 300;
const COOP_MES    = Math.round(COOP_SEM * S_MES);
const FECHA_HOY   = '2026-06-02';
const MES_INICIO  = '2026-06';

const FIJOS = [
  {id:'renta',        label:'Renta',               icon:'🏠', monto:300 },
  {id:'luz',          label:'Luz',                 icon:'💡', monto:90  },
  {id:'seguro_carro', label:'Seguro del Carro',    icon:'🚗', monto:100 },
  {id:'seguro_salud', label:'Seguro de Salud',     icon:'🏥', monto:55  },
  {id:'telefono',     label:'Teléfono',             icon:'📱', monto:100 },
  {id:'tarjetas',     label:'Tarjetas de Crédito', icon:'💳', monto:150 },
  {id:'cooperativa',  label:'Cooperativa',         icon:'🤝', monto:COOP_MES},
  {id:'comida',       label:'Comida (casa)',        icon:'🛒', monto:Math.round(60*S_MES)},
  {id:'combustible',  label:'Combustible',          icon:'⛽', monto:Math.round(35*S_MES)},
];
const TOTAL_FIJOS = FIJOS.reduce((s,c)=>s+c.monto,0);

const VARIABLES = [
  {id:'comida_fuera', label:'Comida Fuera',      icon:'🍔', limite:200},
  {id:'novia',        label:'Novia',             icon:'💕', limite:150},
  {id:'venezuela',    label:'Venezuela',         icon:'🇻🇪', limite:100},
  {id:'ropa',         label:'Ropa',              icon:'👕', limite:200},
];
const TOTAL_VARS = VARIABLES.reduce((s,c)=>s+c.limite,0);
const META_AHORRO = 400;

const TODAS_CATS = [
  ...FIJOS.map(c=>({...c, tipo:'fijo',     limite:c.monto})),
  ...VARIABLES.map(c=>({...c, tipo:'variable', monto:c.limite})),
  {id:'ahorro',label:'Ahorro',icon:'💰',monto:META_AHORRO,tipo:'ahorro',limite:META_AHORRO},
];

const CATS_RAPIDAS = [
  {id:'comida_fuera',label:'Comida',     icon:'🍔'},
  {id:'combustible', label:'Gasolina',   icon:'⛽'},
  {id:'comida',      label:'Super',      icon:'🛒'},
  {id:'novia',       label:'Novia',      icon:'💕'},
  {id:'ropa',        label:'Ropa',       icon:'👕'},
  {id:'venezuela',   label:'Venezuela',  icon:'🇻🇪'},
  {id:'tarjetas',    label:'Tarjetas',   icon:'💳'},
  {id:'renta',       label:'Renta',      icon:'🏠'},
  {id:'luz',         label:'Luz',        icon:'💡'},
  {id:'telefono',    label:'Teléfono',   icon:'📱'},
  {id:'seguro_carro',label:'Seg. Carro', icon:'🚗'},
  {id:'seguro_salud',label:'Seg. Salud', icon:'🏥'},
  {id:'cooperativa', label:'Cooperativa',icon:'🤝'},
];

const FUENTES = [
  {id:'quintecars',label:'Quintecars',  icon:'🔧'},
  {id:'delivery',  label:'Delivery',    icon:'🛵'},
  {id:'extra',     label:'Extra',       icon:'💼'},
  {id:'venta',     label:'Venta',       icon:'🛒'},
  {id:'otro',      label:'Otro',        icon:'💵'},
];

const MESES_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// ════════════════════════════════════════════════════════════
// 3. ESTADO
// ════════════════════════════════════════════════════════════
let sb = null;
let channel = null;

const ST = {
  syncCode: localStorage.getItem('syncCode') || null,
  gastos:   [],
  ingresos: [],
  coop:     {ciclo:1, semanas:0, pagos:0},
  tab:      'inicio',
  mes:      MES_INICIO,
  online:   navigator.onLine,
  syncing:  false,
  // quick panel
  qOpen:  false,
  qTipo:  'gasto',
  qCat:   'comida_fuera',
  qFuente:'quintecars',
  qMonto: '',
  qDesc:  '',
  qErr:   '',
  // edit modal
  eOpen:  false,
  eTipo:  'gasto',
  eItem:  null,
  eMonto: '',
  eDesc:  '',
  eCat:   'comida_fuera',
  eFuente:'quintecars',
  eFecha: FECHA_HOY,
  eErr:   '',
  // tips
  tOpen: false,
  tips:  [],
  // setup
  showInstructions: false,
};

// ════════════════════════════════════════════════════════════
// 4. HELPERS
// ════════════════════════════════════════════════════════════
const f2 = n => '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fI = n => '$'+Math.round(n||0).toLocaleString('en-US');
const getLunes = f => {
  const d=new Date(f+'T12:00:00'),dy=d.getDay(),diff=d.getDate()-dy+(dy===0?-6:1),l=new Date(d);
  l.setDate(diff); return l.toISOString().split('T')[0];
};
const getMesLabel = k => { if(!k) return ''; const [y,m]=k.split('-'); return `${MESES_ES[parseInt(m)-1]} ${y}`; };

function gastadoCat(id, mes) {
  return ST.gastos.filter(g=>g.categoria===id && g.fecha?.startsWith(mes)).reduce((s,g)=>s+g.monto,0);
}
function ingresadoF(id, mes) {
  return ST.ingresos.filter(i=>i.fuente===id && i.fecha?.startsWith(mes)).reduce((s,i)=>s+i.monto,0);
}

function getMesesDisponibles() {
  const set = new Set([...ST.gastos.map(g=>g.fecha?.slice(0,7)),...ST.ingresos.map(i=>i.fecha?.slice(0,7))].filter(Boolean));
  set.add(MES_INICIO);
  return [...set].sort().reverse();
}

let toastTimer = null;
function showToast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.className = `toast toast-${tipo}`;
  el.style.display = 'block';
  el.style.opacity = '1';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ if(el){el.style.opacity='0'; setTimeout(()=>el.style.display='none',300);} }, 2500);
}

// ════════════════════════════════════════════════════════════
// 5. SUPABASE
// ════════════════════════════════════════════════════════════
function initSupabase() {
  if (SUPABASE_URL === 'PEGA_TU_URL_AQUI') return false;
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return true;
  } catch(e) { console.error(e); return false; }
}

async function loadData() {
  if (!sb || !ST.syncCode) return;
  ST.syncing = true; render();
  try {
    const {data, error} = await sb.from('finanzas').select('*').eq('sync_code', ST.syncCode).single();
    if (data) {
      ST.gastos   = data.gastos   || [];
      ST.ingresos = data.ingresos || [];
      ST.coop     = data.coop     || {ciclo:1,semanas:0,pagos:0};
      saveLocalCache();
    } else {
      loadLocalCache();
    }
  } catch(e) {
    loadLocalCache();
  }
  ST.syncing = false; render();
}

async function saveData() {
  saveLocalCache();
  if (!sb || !ST.syncCode) return;
  try {
    await sb.from('finanzas').upsert({
      sync_code: ST.syncCode,
      gastos:    ST.gastos,
      ingresos:  ST.ingresos,
      coop:      ST.coop,
      updated_at: new Date().toISOString()
    }, {onConflict:'sync_code'});
  } catch(e) { console.error('Sync error:', e); }
}

function subscribeToChanges() {
  if (!sb || !ST.syncCode) return;
  if (channel) { sb.removeChannel(channel); }
  channel = sb.channel('finanzas-'+ST.syncCode)
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'finanzas',
      filter: `sync_code=eq.${ST.syncCode}`
    }, payload => {
      if (payload.new && payload.new.sync_code === ST.syncCode) {
        ST.gastos   = payload.new.gastos   || [];
        ST.ingresos = payload.new.ingresos || [];
        ST.coop     = payload.new.coop     || {ciclo:1,semanas:0,pagos:0};
        saveLocalCache();
        render();
        showToast('↻ Sincronizado', 'green');
      }
    })
    .subscribe();
}

function saveLocalCache() {
  try {
    localStorage.setItem('gastos',   JSON.stringify(ST.gastos));
    localStorage.setItem('ingresos', JSON.stringify(ST.ingresos));
    localStorage.setItem('coop',     JSON.stringify(ST.coop));
  } catch(e) {}
}

function loadLocalCache() {
  try {
    const g = localStorage.getItem('gastos');   if(g) ST.gastos   = JSON.parse(g);
    const i = localStorage.getItem('ingresos'); if(i) ST.ingresos = JSON.parse(i);
    const c = localStorage.getItem('coop');     if(c) ST.coop     = JSON.parse(c);
  } catch(e) {}
}

// 7. TIPS
// ════════════════════════════════════════════════════════════
function generarTips(catId, monto, gastosMes) {
  const cat    = TODAS_CATS.find(c=>c.id===catId);
  const limite = cat?.limite || cat?.monto || 0;
  const gastado= gastosMes.filter(g=>g.categoria===catId).reduce((s,g)=>s+g.monto,0);
  const totalG = gastosMes.reduce((s,g)=>s+g.monto,0);
  const totalI = ST.ingresos.filter(i=>i.fecha?.startsWith(ST.mes)).reduce((s,i)=>s+i.monto,0);
  const lunesH = getLunes(FECHA_HOY);
  const ingSem = ST.ingresos.filter(i=>getLunes(i.fecha)===lunesH).reduce((s,i)=>s+i.monto,0);
  const tips   = [];

  if (limite>0 && gastado>limite) {
    tips.push({tipo:'red',icon:'🚨',titulo:'¡Límite superado!',
      msg:`Te pasaste el presupuesto de ${cat?.label} por ${f2(gastado-limite)} este mes. Tienes que compensarlo reduciendo en otra área.`});
  } else if (limite>0 && gastado>=limite*0.8) {
    const pct=Math.round((gastado/limite)*100);
    tips.push({tipo:'amber',icon:'⚠️',titulo:'Presupuesto casi agotado',
      msg:`Llevas el ${pct}% del presupuesto de ${cat?.label}. Solo te quedan ${f2(limite-gastado)} para el resto del mes.`});
  }

  if (totalI>0 && totalG>totalI) {
    tips.push({tipo:'red',icon:'📉',titulo:'Gastas más de lo que ganas',
      msg:`Este mes llevas ${f2(totalG)} gastado y solo ${f2(totalI)} ingresado. Diferencia: ${f2(totalG-totalI)} en rojo.`});
  }

  if (ingSem===0) {
    tips.push({tipo:'amber',icon:'💡',titulo:'Sin ingresos esta semana',
      msg:`Aún no has registrado ingresos esta semana. Tu meta es ${fI(META_SEM)}. Registra lo que ganas en Quintecars o delivery.`});
  } else if (ingSem < META_SEM*0.5) {
    tips.push({tipo:'amber',icon:'🎯',titulo:'Meta semanal lejos',
      msg:`Llevas ${f2(ingSem)} esta semana de tu meta de ${fI(META_SEM)}. Necesitas ${f2(META_SEM-ingSem)} más para cubrirlo todo.`});
  } else if (ingSem >= META_SEM) {
    tips.push({tipo:'green',icon:'🎉',titulo:'¡Meta semanal alcanzada!',
      msg:`Llevas ${f2(ingSem)} esta semana. Superaste tu meta de ${fI(META_SEM)}. ¡Excelente semana, Manuel!`});
  }

  if (limite>0 && monto>=limite*0.5 && cat?.tipo==='variable') {
    tips.push({tipo:'amber',icon:'💸',titulo:'Gasto grande de una vez',
      msg:`Este gasto representa el ${Math.round((monto/limite)*100)}% de tu presupuesto mensual de ${cat?.label} (${fI(limite)}).`});
  }

  if (tips.length===0 && limite>0) {
    tips.push({tipo:'green',icon:'✅',titulo:'Vas bien',
      msg:`Llevas ${Math.round((gastado/limite)*100)}% del presupuesto de ${cat?.label}. Te quedan ${f2(limite-gastado)} disponibles este mes.`});
  }

  if (ingSem < META_SEM) {
    tips.push({tipo:'blue',icon:'🔧',titulo:'Consejo Quintecars',
      msg:`Con tu meta de ${fI(META_SEM)}/sem, necesitas ~${fI(META_SEM/5)}/día. Un servicio de frenos o tune-up te cubre un día completo.`});
  }

  return tips.sort((a,b)=>({red:0,amber:1,green:2,blue:3}[a.tipo]-({red:0,amber:1,green:2,blue:3}[b.tipo]))).slice(0,3);
}

function mostrarTips(catId, monto, gastosMes) {
  ST.tips  = generarTips(catId, monto, gastosMes);
  ST.tOpen = true;
  render();
}

}

// ── HISTORIAL ─────────────────────────────────────────────
function renderHistorial() {
  const mes  = ST.mes;
  const gasM = [...ST.gastos.filter(g=>g.fecha?.startsWith(mes))];
  const ingM = [...ST.ingresos.filter(i=>i.fecha?.startsWith(mes))];
  const totalG=gasM.reduce((s,g)=>s+g.monto,0);
  const totalI=ingM.reduce((s,i)=>s+i.monto,0);

  // Semanas
  const semMap={};
  ingM.forEach(i=>{ const k=getLunes(i.fecha); semMap[k]=(semMap[k]||0)+i.monto; });
  const sems=Object.entries(semMap).sort((a,b)=>a[0].localeCompare(b[0]));

  let html = `<div class="sec-label">Historial — ${getMesLabel(mes)}</div>`;

  // Semanas
  sems.forEach(([k,v])=>{
    const pct=Math.min(100,(v/META_SEM)*100);
    const clr=pct>=100?'#2D7A4F':pct>=70?'#A0622A':'#B83232';
    html+=`<div class="week-sem">
      <div class="week-sem-row"><span style="color:#6B6B6B">Semana ${k}</span><span style="font-weight:bold;color:${clr}">${f2(v)} / $${META_SEM}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${clr}"></div></div>
      <div style="font-size:10px;margin-top:4px;color:${clr}">${pct>=100?'✓ Meta alcanzada':`Faltan ${fI(META_SEM-v)}`}</div>
    </div>`;
  });

  // Todos los movimientos mezclados
  const todos = [
    ...ingM.map(i=>({...i,_t:'ingreso'})),
    ...gasM.map(g=>({...g,_t:'gasto'}))
  ].sort((a,b)=>b.fecha.localeCompare(a.fecha));

  if (todos.length===0) {
    html+=`<div style="text-align:center;padding:48px 0;color:#9B9B9B;font-style:italic">Sin movimientos este mes.</div>`;
  } else {
    html+=`<div class="card" style="padding:0;overflow:hidden">`;
    todos.forEach((item,idx)=>{
      const isG=item._t==='gasto';
      const meta=isG?TODAS_CATS.find(c=>c.id===item.categoria):FUENTES.find(f=>f.id===item.fuente);
      const clr=isG?'#B83232':'#2D7A4F';
      const sign=isG?'-':'+';
      html+=`<div class="move-row">
        <div class="move-icon">${meta?.icon||'💰'}</div>
        <div class="move-info">
          <div class="move-desc">${item.descripcion}</div>
          <div class="move-sub">${meta?.label||''} · ${item.fecha}</div>
        </div>
        <span class="move-amt" style="color:${clr}">${sign}${f2(item.monto)}</span>
        <button class="move-btn btn-edit" onclick='abrirEditar(${JSON.stringify(item).replace(/'/g,"&#39;")})'>✏</button>
        <button class="move-btn btn-del" onclick="${isG?`eliminarGasto('${item.id}')`:`eliminarIngreso('${item.id}')`}">✕</button>
      </div>`;
    });
    html+=`</div>`;

    html+=`<div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:#6B6B6B">Total ingresado</span><span style="color:#2D7A4F;font-weight:bold">${f2(totalI)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:#6B6B6B">Total gastado</span><span style="color:#B83232;font-weight:bold">${f2(totalG)}</span></div>
      <hr class="divider">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:bold"><span>Balance</span><span style="color:${totalI-totalG>=0?'#2D7A4F':'#B83232'}">${f2(totalI-totalG)}</span></div>
    </div>`;
  }

  html+=`<div style="height:8px"></div>`;
  return html;
}

// ── NAV ───────────────────────────────────────────────────
function renderNav() {
  const tabs=[{id:'inicio',icon:'📊',label:'Inicio'},{id:'historial',icon:'📋',label:'Historial'}];
  return `<nav class="nav">${tabs.map(t=>`
    <button class="nav-btn ${ST.tab===t.id?'on':'off'}" onclick="ST.tab='${t.id}';render()">
      <span class="nav-icon">${t.icon}</span><span class="nav-label">${t.label}</span>
    </button>`).join('')}</nav>`;
}

// ── QUICK PANEL ───────────────────────────────────────────
function renderQuickPanel() {
  const isG = ST.qTipo==='gasto';
  const cats = isG ? CATS_RAPIDAS : FUENTES;
  const selId= isG ? ST.qCat : ST.qFuente;
  const clr  = isG ? '#B83232':'#2D7A4F';
  const chips = cats.map(c=>`
    <div class="cat-chip ${c.id===selId?(isG?'sel-g':'sel-i'):''}" onclick="${isG?`ST.qCat='${c.id}'`:`ST.qFuente='${c.id}'`};render()">
      <div class="ci">${c.icon}</div>
      <div class="cl" style="color:${c.id===selId?clr:'#9B9B9B'}">${c.label}</div>
    </div>`).join('');

  return `<div class="overlay">
    <div class="overlay-bg" onclick="closeQuick()"></div>
    <div class="panel">
      <div class="drag-bar"></div>
      <div class="tipo-tabs">
        <div class="tipo-tab ${isG?'gasto-on':'off'}" onclick="ST.qTipo='gasto';render()">💸  Gasto</div>
        <div class="tipo-tab ${!isG?'ingreso-on':'off'}" onclick="ST.qTipo='ingreso';render()">💵  Ingreso</div>
      </div>
      <div class="cat-scroll">${chips}</div>
      <input class="inp" id="qDesc" placeholder="Descripción (opcional)" value="${ST.qDesc}" oninput="ST.qDesc=this.value">
      <div class="monto-wrap">
        <span class="monto-sign ${isG?'red':'green'}">$</span>
        <input class="monto-inp ${isG?'red':'green'}" id="qMonto" type="number" inputmode="decimal" placeholder="0.00"
          value="${ST.qMonto}" oninput="ST.qMonto=this.value" onkeydown="if(event.key==='Enter')guardarRapido()">
      </div>
      ${ST.qErr?`<div class="err">${ST.qErr}</div>`:''}
      <button class="btn-save ${isG?'btn-red':'btn-green'}" onclick="guardarRapido()">
        ${isG?'Registrar Gasto':'Registrar Ingreso'}
      </button>
    </div>
  </div>`;
}

// ── TIPS MODAL ────────────────────────────────────────────
function renderTipsModal() {
  const tipClass={red:'tip-red',amber:'tip-amber',green:'tip-green',blue:'tip-blue'};
  const tipCards = ST.tips.map(t=>`
    <div class="tip-card ${tipClass[t.tipo]}">
      <div class="tip-head"><span>${t.icon}</span>${t.titulo}</div>
      <div class="tip-msg">${t.msg}</div>
    </div>`).join('');
  return `<div class="overlay">
    <div class="overlay-bg" onclick="ST.tOpen=false;render()"></div>
    <div class="panel">
      <div class="drag-bar"></div>
      <div class="sec-label" style="margin-top:0">💬 Análisis de tu gasto</div>
      ${tipCards}
      <button class="btn-save btn-gray" onclick="ST.tOpen=false;render()">Entendido</button>
    </div>
  </div>`;
}

// ── EDIT MODAL ────────────────────────────────────────────
function renderEditModal() {
  const isG = ST.eTipo==='gasto';
  const clr = isG?'#B83232':'#2D7A4F';
  const chips = (isG?TODAS_CATS.filter(c=>c.id!=='ahorro'):FUENTES).map(c=>{
    const selId = isG?ST.eCat:ST.eFuente;
    return `<div class="cat-chip ${c.id===selId?(isG?'sel-g':'sel-i'):''}" onclick="${isG?`ST.eCat='${c.id}'`:`ST.eFuente='${c.id}'`};render()">
      <div class="ci">${c.icon}</div>
      <div class="cl" style="color:${c.id===selId?clr:'#9B9B9B'}">${c.label}</div>
    </div>`;
  }).join('');

  return `<div class="overlay">
    <div class="overlay-bg" onclick="cerrarEditar()"></div>
    <div class="panel">
      <div class="drag-bar"></div>
      <div class="edit-banner">
        <span>✏ Editando ${isG?'gasto':'ingreso'}: <strong>${ST.eItem?.descripcion||''}</strong></span>
        <button class="cancel-btn" onclick="cerrarEditar()">Cancelar</button>
      </div>
      <div class="cat-scroll">${chips}</div>
      <div class="inp-label">Descripción</div>
      <input class="inp" id="eDesc" value="${ST.eDesc}" oninput="ST.eDesc=this.value" placeholder="Descripción...">
      <div class="inp-label">Monto</div>
      <div class="monto-wrap">
        <span class="monto-sign ${isG?'red':'green'}">$</span>
        <input class="monto-inp ${isG?'red':'green'}" id="eMonto" type="number" inputmode="decimal" placeholder="0.00"
          value="${ST.eMonto}" oninput="ST.eMonto=this.value">
      </div>
      <div class="inp-label">Fecha</div>
      <input class="inp" id="eFecha" type="date" value="${ST.eFecha}" oninput="ST.eFecha=this.value">
      ${ST.eErr?`<div class="err">${ST.eErr}</div>`:''}
      <button class="btn-save ${isG?'btn-red':'btn-green'}" onclick="guardarEdicion()">💾 Guardar Cambios</button>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════
// 9. HANDLERS
// ════════════════════════════════════════════════════════════
function openQuick() { ST.qOpen=true; ST.qErr=''; render(); setTimeout(()=>document.getElementById('qMonto')?.focus(),100); }
function closeQuick(){ ST.qOpen=false; ST.qMonto=''; ST.qDesc=''; ST.qErr=''; render(); }

function guardarRapido() {
  const monto = parseFloat(ST.qMonto);
  if (!monto||monto<=0) { ST.qErr='Ingresa un monto válido.'; render(); return; }
  const isG = ST.qTipo==='gasto';
  const desc = ST.qDesc.trim() || (isG
    ? (CATS_RAPIDAS.find(c=>c.id===ST.qCat)?.label||'Gasto')
    : (FUENTES.find(f=>f.id===ST.qFuente)?.label||'Ingreso'));
  ST.qMonto=''; ST.qDesc=''; ST.qErr=''; ST.qOpen=false;
  if (isG) agregarGasto(desc, monto, ST.qCat, FECHA_HOY);
  else     agregarIngreso(desc, monto, ST.qFuente, FECHA_HOY);
}

function abrirEditar(item) {
  ST.eItem   = item;
  ST.eTipo   = item._t;
  ST.eDesc   = item.descripcion;
  ST.eMonto  = String(item.monto);
  ST.eCat    = item.categoria||'comida_fuera';
  ST.eFuente = item.fuente||'quintecars';
  ST.eFecha  = item.fecha;
  ST.eErr    = '';
  ST.eOpen   = true;
  render();
}

function cerrarEditar() { ST.eOpen=false; ST.eItem=null; render(); }

function guardarEdicion() {
  const monto=parseFloat(document.getElementById('eMonto')?.value||ST.eMonto);
  const desc =(document.getElementById('eDesc')?.value||ST.eDesc).trim();
  const fecha=(document.getElementById('eFecha')?.value||ST.eFecha);
  if (!desc) { ST.eErr='Escribe una descripción.'; render(); return; }
  if (!monto||monto<=0) { ST.eErr='Monto inválido.'; render(); return; }
  if (ST.eTipo==='gasto')   editarGasto(ST.eItem.id, desc, monto, ST.eCat, fecha);
  else                       editarIngreso(ST.eItem.id, desc, monto, ST.eFuente, fecha);
  cerrarEditar();
}

function registrarSemanaCoop() {
  if (ST.coop.semanas>=9) {
    actualizarCoop({ciclo:ST.coop.ciclo+1,semanas:0,pagos:ST.coop.pagos+1});
    showToast('🎉 Ciclo completo — $3,000 a la deuda','green');
  } else {
    actualizarCoop({...ST.coop,semanas:ST.coop.semanas+1});
    showToast(`Semana ${ST.coop.semanas+1} registrada`);
  }
}

function deshacerCoop() {
  if (ST.coop.semanas>0) actualizarCoop({...ST.coop,semanas:ST.coop.semanas-1});
}

// ════════════════════════════════════════════════════════════
// 10. INIT
// ════════════════════════════════════════════════════════════
window.addEventListener('online',  ()=>{ ST.online=true;  render(); if(ST.syncCode) loadData(); });
window.addEventListener('offline', ()=>{ ST.online=false; render(); });

async function init() {
  const ready = initSupabase();
  if (ST.syncCode) {
    loadLocalCache();
    render();
    if (ready) {
      await loadData();
      subscribeToChanges();
    }
  } else {
    render();
  }
}

init();
</script>
