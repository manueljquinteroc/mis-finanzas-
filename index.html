<script>
// ══════════════════════════════════════════════
// CONFIG SUPABASE
// ══════════════════════════════════════════════
const SUPABASE_URL = 'https://zwlzzyinwpkwatbfaipy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bHp6eWlud3Brd2F0YmZhaXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NDM3NzYsImV4cCI6MjA5NjAxOTc3Nn0.vkqIXNfabqFZkfveJhADHHrXoVBSY5_hmiB-86agNk0';

// ══════════════════════════════════════════════
// CONSTANTES DE MANUEL
// ══════════════════════════════════════════════
const S_MES   = 4.33;
const ING_SEM = 643;

let FIJOS = [
  {id:'renta',        label:'Renta',               icon:'🏠', monto:300},
  {id:'luz',          label:'Luz',                 icon:'💡', monto:90},
  {id:'seguro_carro', label:'Seguro del Carro',    icon:'🚗', monto:100},
  {id:'seguro_salud', label:'Seguro de Salud',     icon:'🏥', monto:55},
  {id:'telefono',     label:'Teléfono',             icon:'📱', monto:100},
  {id:'tarjetas',     label:'Tarjetas de Crédito', icon:'💳', monto:150},
  {id:'comida',       label:'Comida (casa)',        icon:'🛒', monto:Math.round(60*S_MES)},
  {id:'combustible',  label:'Combustible',          icon:'⛽', monto:Math.round(35*S_MES)},
  {id:'suscripciones',label:'Suscripciones',        icon:'📺', monto:30},
];
function totalFijos(){return FIJOS.reduce((s,c)=>s+c.monto,0);}

let VARIABLES = [
  {id:'comida_fuera',label:'Comida Fuera',  icon:'🍔',limite:200},
  {id:'novia',       label:'Novia',         icon:'💕',limite:150},
  {id:'venezuela',   label:'Venezuela',     icon:'🇻🇪',limite:100},
  {id:'ropa',        label:'Ropa',          icon:'👕',limite:200},
  {id:'eventos',     label:'Eventos',       icon:'🎉',limite:80},
  {id:'regalos',     label:'Regalos',       icon:'🎁',limite:80},
  {id:'ayudas',      label:'Ayudas',        icon:'🤲',limite:50},
  {id:'deporte',     label:'Deporte',       icon:'🏋️',limite:95},
];
function totalVars(){return VARIABLES.reduce((s,c)=>s+c.limite,0);}
const META_AHORRO = 400;

// ── CALCULADORA SEMANAL INTELIGENTE ─────────────
// Recalcula cada vez que se llama: cuánto hay que producir esta semana
// para cubrir lo que falta del presupuesto del mes, repartido entre
// las semanas que quedan del mes.
function presupuestoMesTotal(){return totalFijos()+totalVars()+META_AHORRO;}
function semanasRestantesMes(){
  const hoy=new Date(HOY()+'T12:00:00');
  const finMes=new Date(hoy.getFullYear(),hoy.getMonth()+1,0);
  const diasRestantes=Math.floor((finMes-hoy)/86400000)+1;
  return Math.max(1,Math.ceil(diasRestantes/7));
}
function metaSemanalDinamica(){
  const mes=getMesKey();
  const tIMes=(ST.ingresos||[]).filter(i=>i.fecha?.startsWith(mes)).reduce((s,i)=>s+i.monto,0);
  const restante=Math.max(0,presupuestoMesTotal()-tIMes);
  return Math.round(restante/semanasRestantesMes());
}

function todasCats(){return [
  ...FIJOS.map(c=>({...c,tipo:'fijo',   limite:c.monto})),
  ...VARIABLES.map(c=>({...c,tipo:'variable',monto:c.limite})),
  {id:'ahorro',label:'Ahorro',icon:'💰',monto:META_AHORRO,tipo:'ahorro',limite:META_AHORRO},
];}

const CATS_RAPIDAS_BASE = [
  {id:'comida_fuera',label:'Comida',     icon:'🍔'},
  {id:'combustible', label:'Gasolina',   icon:'⛽'},
  {id:'comida',      label:'Super',      icon:'🛒'},
  {id:'novia',       label:'Novia',      icon:'💕'},
  {id:'ropa',        label:'Ropa',       icon:'👕'},
  {id:'venezuela',   label:'Venezuela',  icon:'🇻🇪'},
  {id:'tarjetas',    label:'Tarjetas',   icon:'💳'},
  {id:'renta',       label:'Renta',      icon:'🏠'},
  {id:'luz',         label:'Luz',        icon:'💡'},
  {id:'telefono',    label:'Teléfono',   icon:'📱'},
  {id:'seguro_carro',label:'Seg. Carro', icon:'🚗'},
  {id:'seguro_salud',label:'Seg. Salud', icon:'🏥'},
  {id:'eventos',     label:'Eventos',   icon:'🎉'},
  {id:'regalos',     label:'Regalos',   icon:'🎁'},
  {id:'suscripciones',label:'Suscrip.', icon:'📺'},
  {id:'ayudas',      label:'Ayudas',    icon:'🤲'},
  {id:'deporte',     label:'Deporte',   icon:'🏋️'},
];
function catsRapidas(){
  const validIds=new Set([...FIJOS.map(f=>f.id),...VARIABLES.map(v=>v.id)]);
  const base=CATS_RAPIDAS_BASE.filter(c=>validIds.has(c.id));
  const baseIds=new Set(base.map(c=>c.id));
  const custom=[...FIJOS.filter(f=>f.custom),...VARIABLES.filter(v=>v.custom)]
    .filter(c=>!baseIds.has(c.id)).map(c=>({id:c.id,label:c.label,icon:c.icon}));
  return [...base,...custom];
}

function aplicarConfig(){
  const cfg=ST.cfg||{};
  const removed=cfg.deudasRemoved||[];
  DEUDAS_CFG = DEUDAS_CFG.filter(d=>!d.custom && !removed.includes(d.id));
  if(cfg.deudasOverride){
    DEUDAS_CFG.forEach(d=>{
      const o=cfg.deudasOverride[d.id];
      if(o){if(o.total!=null)d.total=o.total;if(o.min!=null)d.min=o.min;if(o.label)d.label=o.label;}
    });
  }
  (cfg.deudasCustom||[]).forEach(d=>{
    if(!DEUDAS_CFG.find(x=>x.id===d.id))DEUDAS_CFG.push({...d,custom:true});
  });
  const fijosRemoved=cfg.fijosRemoved||[];
  FIJOS = FIJOS.filter(f=>!f.custom && !fijosRemoved.includes(f.id));
  if(cfg.fijosOverride){
    FIJOS.forEach(f=>{if(cfg.fijosOverride[f.id]!=null)f.monto=cfg.fijosOverride[f.id];});
  }
  (cfg.fijosCustom||[]).forEach(f=>{
    if(!FIJOS.find(x=>x.id===f.id))FIJOS.push({...f,custom:true});
  });
  const varsRemoved=cfg.varsRemoved||[];
  VARIABLES = VARIABLES.filter(v=>!v.custom && !varsRemoved.includes(v.id));
  if(cfg.varsOverride){
    VARIABLES.forEach(v=>{if(cfg.varsOverride[v.id]!=null)v.limite=cfg.varsOverride[v.id];});
  }
  (cfg.varsCustom||[]).forEach(v=>{
    if(!VARIABLES.find(x=>x.id===v.id))VARIABLES.push({...v,custom:true});
  });
  DEUDAS_CFG.forEach(d=>{if(!ST.deudas[d.id])ST.deudas[d.id]={pagado:0};});
}

async function guardarAjustesCfg(){
  FIJOS.forEach(f=>{
    const v=parseFloat(document.getElementById('cfgFijo_'+f.id)?.value);
    if(!isNaN(v)&&v>=0){
      if(f.custom){const c=ST.cfg.fijosCustom.find(x=>x.id===f.id);if(c)c.monto=v;}
      else ST.cfg.fijosOverride[f.id]=v;
      f.monto=v;
    }
  });
  VARIABLES.forEach(v=>{
    const val=parseFloat(document.getElementById('cfgVar_'+v.id)?.value);
    if(!isNaN(val)&&val>=0){
      if(v.custom){const c=ST.cfg.varsCustom.find(x=>x.id===v.id);if(c)c.limite=val;}
      else ST.cfg.varsOverride[v.id]=val;
      v.limite=val;
    }
  });
  DEUDAS_CFG.forEach(d=>{
    const tEl=document.getElementById('cfgDeudaTotal_'+d.id);
    const mEl=document.getElementById('cfgDeudaMin_'+d.id);
    const lEl=document.getElementById('cfgDeudaLabel_'+d.id);
    const t=parseFloat(tEl?.value), m=parseFloat(mEl?.value), l=(lEl?.value||'').trim();
    if(!ST.cfg.deudasOverride[d.id])ST.cfg.deudasOverride[d.id]={};
    if(!isNaN(t)&&t>=0){ST.cfg.deudasOverride[d.id].total=t;d.total=t;}
    if(!isNaN(m)&&m>=0){ST.cfg.deudasOverride[d.id].min=m;d.min=m;}
    if(l){ST.cfg.deudasOverride[d.id].label=l;d.label=l;}
    // si es custom, también actualizar la copia en deudasCustom
    const c=ST.cfg.deudasCustom.find(x=>x.id===d.id);
    if(c){if(!isNaN(t)&&t>=0)c.total=t;if(!isNaN(m)&&m>=0)c.min=m;if(l)c.label=l;}
  });
  await saveData();
  showToast('✓ Ajustes guardados','gr');
  render();
}

function initSB(){
  if(SUPABASE_URL==='URL')return false;
  try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return true;}catch(e){return false;}
}
async function loadData(){
  if(!sb||!ST.syncCode)return;
  ST.syncing=true;render();
  try{
    const{data}=await sb.from('finanzas').select('*').eq('sync_code',ST.syncCode).single();
    if(data){
      ST.gastos      = data.gastos       ||[];
      ST.ingresos    = data.ingresos     ||[];
      ST.coop        = data.coop         ||{ciclo:1,semanas:0,pagos:0};
      ST.deudas      = data.deudas       ||defaultDeudas();
      ST.pagos_deuda = data.pagos_deuda  ||[];
      ST.inversiones    = data.inversiones    ||defaultInversiones();
      ST.pagos_inversion= data.pagos_inversion||[];
      ST.cfg = data.config||{deudasOverride:{},deudasCustom:[],deudasRemoved:[],fijosOverride:{},varsOverride:{},fijosCustom:[],fijosRemoved:[],varsCustom:[],varsRemoved:[]};
      aplicarConfig();
      saveCache();
    } else { loadCache(); }
  }catch(e){loadCache();}
  ST.syncing=false;render();
}
function setPending(v){pendingSync=v;try{localStorage.setItem('pendingSync',v?'1':'0');}catch(e){}}
async function saveData(){
  saveCache();
  if(!sb||!ST.syncCode){setPending(true);return false;}
  ST.syncing=true;render();
  try{
    const{error}=await sb.from('finanzas').upsert({
      sync_code:ST.syncCode,
      gastos:ST.gastos, ingresos:ST.ingresos,
      coop:ST.coop, deudas:ST.deudas,
      pagos_deuda:ST.pagos_deuda,
      inversiones:ST.inversiones,
      pagos_inversion:ST.pagos_inversion,
      config:ST.cfg,
      updated_at:new Date().toISOString()
    },{onConflict:'sync_code'});
    if(error)throw error;
    setPending(false);ST.syncing=false;
    return true;
  }catch(e){
    console.error(e);
    setPending(true);ST.syncing=false;
    showToast('⚠ No se pudo guardar en la nube. Se reintentará.','rd');
    return false;
  }
}
async function reintentarSync(){
  if(!sb||!ST.syncCode||!pendingSync)return;
  const ok=await saveData();
  if(ok){showToast('✓ Cambios pendientes sincronizados','gr');render();}
}
function subChanges(){
  if(!sb||!ST.syncCode)return;
  if(ch)sb.removeChannel(ch);
  ch=sb.channel('fin-'+ST.syncCode)
    .on('postgres_changes',{event:'*',schema:'public',table:'finanzas',filter:`sync_code=eq.${ST.syncCode}`},p=>{
      if(p.new&&p.new.sync_code===ST.syncCode){
        if(pendingSync)return; // tenemos cambios locales sin subir: no los pisamos con lo remoto
        ST.gastos=p.new.gastos||[];ST.ingresos=p.new.ingresos||[];
        ST.coop=p.new.coop||{ciclo:1,semanas:0,pagos:0};
        ST.deudas=p.new.deudas||defaultDeudas();
        ST.pagos_deuda=p.new.pagos_deuda||[];
        ST.inversiones=p.new.inversiones||defaultInversiones();
        ST.pagos_inversion=p.new.pagos_inversion||[];
        ST.cfg=p.new.config||{deudasOverride:{},deudasCustom:[],deudasRemoved:[],fijosOverride:{},varsOverride:{},fijosCustom:[],fijosRemoved:[],varsCustom:[],varsRemoved:[]};
        aplicarConfig();
        saveCache();render();showToast('↻ Sincronizado','gr');
      }
    }).subscribe();
}
function saveCache(){
  try{
    localStorage.setItem('gastos',JSON.stringify(ST.gastos));
    localStorage.setItem('ingresos',JSON.stringify(ST.ingresos));
    localStorage.setItem('coop',JSON.stringify(ST.coop));
    localStorage.setItem('deudas',JSON.stringify(ST.deudas));
    localStorage.setItem('pagos_deuda',JSON.stringify(ST.pagos_deuda));
    localStorage.setItem('inversiones',JSON.stringify(ST.inversiones));
    localStorage.setItem('pagos_inversion',JSON.stringify(ST.pagos_inversion));
    localStorage.setItem('cfg',JSON.stringify(ST.cfg));
  }catch(e){}
}
function loadCache(){
  try{
    const g=localStorage.getItem('gastos');          if(g)ST.gastos=JSON.parse(g);
    const i=localStorage.getItem('ingresos');        if(i)ST.ingresos=JSON.parse(i);
    const c=localStorage.getItem('coop');            if(c)ST.coop=JSON.parse(c);
    const d=localStorage.getItem('deudas');          if(d)ST.deudas=JSON.parse(d);
    const p=localStorage.getItem('pagos_deuda');     if(p)ST.pagos_deuda=JSON.parse(p);
    const inv=localStorage.getItem('inversiones');   if(inv)ST.inversiones=JSON.parse(inv);
    const pi=localStorage.getItem('pagos_inversion');if(pi)ST.pagos_inversion=JSON.parse(pi);
    const cf=localStorage.getItem('cfg');            if(cf)ST.cfg=JSON.parse(cf);
    aplicarConfig();
  }catch(e){}
}

async function agregarGasto(desc,monto,cat,fecha){

  await saveData();
  const mesG=ST.gastos.filter(g=>g.fecha?.startsWith(ST.mes));
  mostrarTips(cat,monto,mesG);
}
async function agregarIngreso(desc,monto,fuente,fecha,deudaId,deudaMonto){
  ST.ingresos=[{id:Date.now().toString(),descripcion:desc,monto,fuente,fecha},...ST.ingresos];
  let sobrante=0;
  if(deudaId&&deudaMonto>0){
    const d=ST.deudas[deudaId]||{pagado:0};
    const cfg=DEUDAS_CFG.find(x=>x.id===deudaId);
    const maxPagar=cfg?cfg.total-d.pagado:deudaMonto;
    const real=Math.min(deudaMonto,maxPagar);
    sobrante=deudaMonto-real;
    ST.deudas={...ST.deudas,[deudaId]:{pagado:(d.pagado||0)+real}};
    ST.pagos_deuda=[{id:Date.now().toString(),deuda_id:deudaId,monto:real,fecha,descripcion:`${desc} → ${cfg?.label}`},...ST.pagos_deuda];
  }
  await saveData();
  if(sobrante>0)showToast(`✓ Ingreso registrado. Sobrante ${f2(sobrante)} no se aplicó (deuda ya cubierta)`,'rd');
  else showToast('✓ Ingreso registrado','gr');
  render();
}
async function depositarInversion(invId,monto,desc,fecha){
  const inv=ST.inversiones[invId]||{depositado:0};
  ST.inversiones={...ST.inversiones,[invId]:{depositado:(inv.depositado||0)+monto}};
  ST.pagos_inversion=[{id:Date.now().toString(),inv_id:invId,monto,fecha,descripcion:desc||(INV_CFG.find(x=>x.id===invId)?.label)},...ST.pagos_inversion];
  await saveData();
  const cfg=INV_CFG.find(x=>x.id===invId);
  showToast(`✓ ${f2(monto)} depositados en ${cfg?.label}`,'gr');
  render();
}

async function pagarDeudaDirecto(deudaId,monto,desc,fecha){
  const d=ST.deudas[deudaId]||{pagado:0};
  const cfg=DEUDAS_CFG.find(x=>x.id===deudaId);
  const maxPagar=cfg?cfg.total-d.pagado:monto;
  const real=Math.min(monto,maxPagar);
  const sobrante=monto-real;
  ST.deudas={...ST.deudas,[deudaId]:{pagado:(d.pagado||0)+real}};
  ST.pagos_deuda=[{id:Date.now().toString(),deuda_id:deudaId,monto:real,fecha,descripcion:desc||`Pago ${cfg?.label}`},...ST.pagos_deuda];
  await saveData();
  if(sobrante>0)showToast(`✓ $${real} aplicados a ${cfg?.label}. Sobrante ${f2(sobrante)} no aplicado`,'rd');
  else showToast(`✓ $${real} aplicados a ${cfg?.label}`,'gr');
  render();
}
async function distribuirCoop(vals){
  const fecha=HOY();
  let sobranteTotal=0;
  Object.entries(vals).forEach(([id,monto])=>{
    if(!monto||monto<=0)return;
    const d=ST.deudas[id]||{pagado:0};
    const cfg=DEUDAS_CFG.find(x=>x.id===id);
    const maxP=cfg?cfg.total-d.pagado:monto;
    const real=Math.min(parseFloat(monto)||0,maxP);
    sobranteTotal+=(parseFloat(monto)||0)-real;
    if(real>0){
      ST.deudas={...ST.deudas,[id]:{pagado:(d.pagado||0)+real}};
      ST.pagos_deuda=[{id:Date.now().toString()+id,deuda_id:id,monto:real,fecha,descripcion:`Cooperativa ciclo ${ST.coop.ciclo-1}`},...ST.pagos_deuda];
    }
  });
  await saveData();
  if(sobranteTotal>0)showToast(`🎉 Distribuido. Sobrante ${f2(sobranteTotal)} sin asignar (deudas cubiertas)`,'rd');
  else showToast('🎉 $3,000 distribuidos','gr');
  render();
}

async function eliminarPagoDeuda(id){

  ST.pagos_deuda=ST.pagos_deuda.filter(x=>x.id!==id);
  const d=ST.deudas[p.deuda_id]||{pagado:0};
  ST.deudas={...ST.deudas,[p.deuda_id]:{pagado:Math.max(0,(d.pagado||0)-p.monto)}};
  await saveData();showToast('Pago eliminado');render();
}
async function eliminarPagoInversion(id){
  if(!confirm('¿Eliminar este depósito? Se restará del total invertido.'))return;
  const p=ST.pagos_inversion.find(x=>x.id===id);if(!p)return;
  ST.pagos_inversion=ST.pagos_inversion.filter(x=>x.id!==id);
  const inv=ST.inversiones[p.inv_id]||{depositado:0};
  ST.inversiones={...ST.inversiones,[p.inv_id]:{depositado:Math.max(0,(inv.depositado||0)-p.monto)}};
  await saveData();showToast('Depósito eliminado');render();
}
async function actualizarCoop(coop){ST.coop=coop;await saveData();render();}

// ══════════════════════════════════════════════
function generarTips(catId,monto,gasM){
  const cat=todasCats().find(c=>c.id===catId);
  const lim=cat?.limite||cat?.monto||0;
  const gastado=gasM.filter(g=>g.categoria===catId).reduce((s,g)=>s+g.monto,0);
  const totalG=gasM.reduce((s,g)=>s+g.monto,0);
  const totalI=ST.ingresos.filter(i=>i.fecha?.startsWith(ST.mes)).reduce((s,i)=>s+i.monto,0);
  const lh=getLunes(HOY());
  const iSem=ST.ingresos.filter(i=>getLunes(i.fecha)===lh).reduce((s,i)=>s+i.monto,0);
  const tips=[];
  if(lim>0&&gastado>lim)tips.push({t:'r',icon:'🚨',titulo:'¡Límite superado!',msg:`Te pasaste el presupuesto de ${cat?.label} por ${f2(gastado-lim)} este mes.`});
  else if(lim>0&&gastado>=lim*.8)tips.push({t:'a',icon:'⚠️',titulo:'Presupuesto casi agotado',msg:`Llevas el ${Math.round((gastado/lim)*100)}% de ${cat?.label}. Quedan ${f2(lim-gastado)}.`});
  if(totalI>0&&totalG>totalI)tips.push({t:'r',icon:'📉',titulo:'Gastas más de lo que ganas',msg:`Este mes llevas ${f2(totalG)} gastado y ${f2(totalI)} ingresado.`});
  if(iSem===0)tips.push({t:'a',icon:'💡',titulo:'Sin ingresos esta semana',msg:`Recuerda registrar lo que ganas. Meta: ${fI(metaSemanalDinamica())}/sem.`});
  else if(iSem<metaSemanalDinamica()*.5)tips.push({t:'a',icon:'🎯',titulo:'Meta semanal lejos',msg:`Llevas ${f2(iSem)} de ${fI(metaSemanalDinamica())} esta semana.`});
  else if(iSem>=metaSemanalDinamica())tips.push({t:'g',icon:'🎉',titulo:'¡Meta semanal alcanzada!',msg:`¡Excelente semana Manuel! Llevas ${f2(iSem)}.`});
  if(lim>0&&monto>=lim*.5&&cat?.tipo==='variable')tips.push({t:'a',icon:'💸',titulo:'Gasto grande',msg:`Este gasto es el ${Math.round((monto/lim)*100)}% de tu presupuesto de ${cat?.label}.`});
  if(tips.length===0&&lim>0)tips.push({t:'g',icon:'✅',titulo:'Vas bien',msg:`Llevas ${Math.round((gastado/lim)*100)}% de ${cat?.label}. Quedan ${f2(lim-gastado)}.`});
  tips.push({t:'b',icon:'🔧',titulo:'Consejo Quintecars',msg:`Meta ${fI(metaSemanalDinamica())}/sem = ~${fI(metaSemanalDinamica()/5)}/día. Un servicio de frenos te cubre un día completo.`});
  return tips.sort((a,b)=>({r:0,a:1,g:2,b:3}[a.t]-({r:0,a:1,g:2,b:3}[b.t]))).slice(0,3);
}
function mostrarTips(cat,monto,gasM){ST.tips=generarTips(cat,monto,gasM);ST.tOpen=true;render();}

let tTimer=null;
function showToast(msg,tipo='ok'){
  const el=document.getElementById('toast');if(!el)return;
  el.textContent=msg;el.className=`toast ${tipo==='gr'?'tgr':tipo==='rd'?'trd':'tok'}`;
  el.style.display='block';el.style.opacity='1';
  if(tTimer)clearTimeout(tTimer);
  tTimer=setTimeout(()=>{if(el){el.style.opacity='0';setTimeout(()=>el.style.display='none',300);}},2400);
}

function getMesesDisp(){
  const s=new Set([...ST.gastos.map(g=>g.fecha?.slice(0,7)),...ST.ingresos.map(i=>i.fecha?.slice(0,7))].filter(Boolean));
  s.add(getMesKey());return[...s].sort().reverse();
}

// ── RACHA DE METAS SEMANALES ─────────────────────
function rachaSemanal(){
  const prevLunes=l=>{const dt=new Date(l+'T12:00:00');dt.setDate(dt.getDate()-7);return dt.toISOString().split('T')[0];};
  const totalSem=l=>ST.ingresos.filter(i=>getLunes(i.fecha)===l).reduce((s,i)=>s+i.monto,0);
  let racha=0;
  let semana=getLunes(HOY());
  if(totalSem(semana)>=metaSemanalDinamica())racha++;
  semana=prevLunes(semana);
  while(totalSem(semana)>=metaSemanalDinamica()){racha++;semana=prevLunes(semana);}
  return racha;
}

function rInicio(){

// ── PROYECCIONES ────────────────────────────────
function ritmoDeuda(deudaId,meses){
  const ahora=new Date();
  const d0=new Date(ahora.getFullYear(),ahora.getMonth()-meses+1,1);
  const corteReal=`${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}`;
  const pagos=ST.pagos_deuda.filter(p=>p.deuda_id===deudaId&&p.fecha&&p.fecha.slice(0,7)>=corteReal);
  const total=pagos.reduce((s,p)=>s+p.monto,0);
  return total/meses;
}

  const tdR=deudaTotalOrig()-tdP;
  const pctD=Math.min(100,(tdP/deudaTotalOrig())*100);

  // Coop tracker
  const ciclosSaldar=Math.ceil(tdR/3000);
  const semanasFaltan=ciclosSaldar*10;

  let h=`<div class="deuda-total">
    <div class="dt-label">Deuda total restante</div>
    <div class="dt-monto">${fI(tdR)}</div>

// ── GRÁFICAS ───────────────────────────────────
function datosMensuales(n){
  const out=[];
  const now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const ing=ST.ingresos.filter(x=>x.fecha?.startsWith(key)).reduce((s,x)=>s+x.monto,0);
    const gas=ST.gastos.filter(x=>x.fecha?.startsWith(key)).reduce((s,x)=>s+x.monto,0);
    out.push({key,label:getMesLabel(key),ingreso:ing,gasto:gas});
  }
  return out;
}
function rGraficaIngGas(){
  const datos=datosMensuales(6);
  const max=Math.max(1,...datos.map(d=>Math.max(d.ingreso,d.gasto)));
  const bars=datos.map(d=>{
    const hI=Math.round((d.ingreso/max)*100), hG=Math.round((d.gasto/max)*100);
    return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="display:flex;align-items:flex-end;gap:2px;height:90px">
        <div style="width:10px;background:#2D7A4F;border-radius:2px 2px 0 0;height:${hI}%" title="Ingreso ${f2(d.ingreso)}"></div>
        <div style="width:10px;background:#B83232;border-radius:2px 2px 0 0;height:${hG}%" title="Gasto ${f2(d.gasto)}"></div>
      </div>
      <div style="font-size:9px;color:#9B9B9B">${d.label.split(' ')[0]}</div>
    </div>`;
  }).join('');
  return`<div class="card">
    <div class="clabel">📊 Ingresos vs Gastos — últimos 6 meses</div>
    <div style="display:flex;gap:4px;align-items:flex-end">${bars}</div>
    <div style="display:flex;gap:14px;margin-top:10px;font-size:11px">
      <span><span style="display:inline-block;width:8px;height:8px;background:#2D7A4F;border-radius:2px;margin-right:4px"></span>Ingreso</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:#B83232;border-radius:2px;margin-right:4px"></span>Gasto</span>
    </div>
  </div>`;
}
function rGraficaCategorias(mes){
  const gasM=ST.gastos.filter(g=>g.fecha?.startsWith(mes));
  const porCat={};
  gasM.forEach(g=>{porCat[g.categoria]=(porCat[g.categoria]||0)+g.monto;});
  const total=Object.values(porCat).reduce((s,v)=>s+v,0);
  if(total<=0)return`<div class="card"><div class="clabel">🥧 Gastos por categoría</div><div style="font-size:12px;color:#9B9B9B;text-align:center;padding:10px 0">Sin gastos este mes todavía.</div></div>`;
  const colores=['#2D7A4F','#B83232','#A0622A','#1B4F8A','#8B5CF6','#DC2626','#22c55e','#3b82f6','#f59e0b','#ec4899'];
  let acc=0,idx=0;
  const stops=[],legend=[];
  Object.entries(porCat).sort((a,b)=>b[1]-a[1]).forEach(([catId,monto])=>{
    const pct=(monto/total)*100;
    const color=colores[idx%colores.length];
    stops.push(`${color} ${acc}% ${acc+pct}%`);
    const cat=todasCats().find(c=>c.id===catId);
    legend.push(`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0"><span><span style="display:inline-block;width:8px;height:8px;background:${color};border-radius:2px;margin-right:5px"></span>${cat?.icon||''} ${esc(cat?.label||catId)}</span><span style="font-weight:bold">${Math.round(pct)}%</span></div>`);
    acc+=pct;idx++;
  });
  return`<div class="card">
    <div class="clabel">🥧 Gastos por categoría</div>
    <div style="display:flex;gap:16px;align-items:center">
      <div style="width:100px;height:100px;border-radius:50%;background:conic-gradient(${stops.join(',')});flex-shrink:0"></div>
      <div style="flex:1">${legend.join('')}</div>
    </div>
  </div>`;
}
function rGraficaFuentesIngreso(mes){
  const ingM=ST.ingresos.filter(i=>i.fecha?.startsWith(mes));
  const porFuente={};
  ingM.forEach(i=>{porFuente[i.fuente]=(porFuente[i.fuente]||0)+i.monto;});
  const total=Object.values(porFuente).reduce((s,v)=>s+v,0);
  if(total<=0)return`<div class="card"><div class="clabel">🥧 Ingresos por fuente</div><div style="font-size:12px;color:#9B9B9B;text-align:center;padding:10px 0">Sin ingresos este mes todavía.</div></div>`;
  const colores=['#2D7A4F','#1B4F8A','#A0622A','#8B5CF6','#DC2626','#22c55e','#3b82f6','#f59e0b','#ec4899','#B83232'];
  let acc=0,idx=0;
  const stops=[],legend=[];
  Object.entries(porFuente).sort((a,b)=>b[1]-a[1]).forEach(([fId,monto])=>{
    const pct=(monto/total)*100;
    const color=colores[idx%colores.length];
    stops.push(`${color} ${acc}% ${acc+pct}%`);
    const f=FUENTES.find(x=>x.id===fId);
    legend.push(`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0"><span><span style="display:inline-block;width:8px;height:8px;background:${color};border-radius:2px;margin-right:5px"></span>${f?.icon||''} ${esc(f?.label||fId)}</span><span style="font-weight:bold">${Math.round(pct)}%</span></div>`);
    acc+=pct;idx++;
  });
  return`<div class="card">
    <div class="clabel">🥧 Ingresos por fuente</div>
    <div style="display:flex;gap:16px;align-items:center">
      <div style="width:100px;height:100px;border-radius:50%;background:conic-gradient(${stops.join(',')});flex-shrink:0"></div>
      <div style="flex:1">${legend.join('')}</div>
    </div>
  </div>`;
}
function rGraficaDeuda(){
  const meses=datosMensuales(6).map(d=>d.key);
  const orig=deudaTotalOrig();
  const pagosPorMes={};
  ST.pagos_deuda.forEach(p=>{const k=p.fecha?.slice(0,7);if(k)pagosPorMes[k]=(pagosPorMes[k]||0)+p.monto;});
  const primerMes=meses[0];
  let pagadoAcum=0;
  ST.pagos_deuda.forEach(p=>{if(p.fecha&&p.fecha.slice(0,7)<primerMes)pagadoAcum+=p.monto;});
  const puntos=meses.map(k=>{pagadoAcum+=(pagosPorMes[k]||0);return Math.max(0,orig-pagadoAcum);});
  const max=Math.max(1,...puntos,orig);
  const w=280,h=70,n=puntos.length;
  const pts=puntos.map((v,i)=>{const x=n>1?(i/(n-1))*w:0;const y=h-(v/max)*h;return`${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');
  return`<div class="card">
    <div class="clabel">📉 Deuda restante — últimos 6 meses</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:70px;overflow:visible" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="#B83232" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:#9B9B9B;margin-top:2px">${meses.map(k=>`<span>${getMesLabel(k).split(' ')[0]}</span>`).join('')}</div>
  </div>`;
}

function rHistorial(){
  const mes=ST.mes;
  const gasM=ST.gastos.filter(g=>g.fecha?.startsWith(mes));
  const ingM=ST.ingresos.filter(i=>i.fecha?.startsWith(mes));
  const tG=gasM.reduce((s,g)=>s+g.monto,0);
  const tI=ingM.reduce((s,i)=>s+i.monto,0);
  const semM={};
  ingM.forEach(i=>{const k=getLunes(i.fecha);semM[k]=(semM[k]||0)+i.monto;});
  const sems=Object.entries(semM).sort((a,b)=>a[0].localeCompare(b[0]));
  let h=rGraficaIngGas()+rGraficaCategorias(mes)+rGraficaFuentesIngreso(mes)+rGraficaDeuda();
  h+=`<div class="slabel">Historial — ${getMesLabel(mes)}</div>`;
  sems.forEach(([k,v])=>{
    const pct=Math.min(100,(v/metaSemanalDinamica())*100),clr=pct>=100?'#2D7A4F':pct>=70?'#A0622A':'#B83232';

      <div class="wsem-r"><span style="color:#6B6B6B">Semana ${k}</span><span style="font-weight:bold;color:${clr}">${f2(v)} / $${metaSemanalDinamica()}</span></div>
      <div class="bt"><div class="bf" style="width:${pct}%;background:${clr}"></div></div>
      <div style="font-size:10px;margin-top:3px;color:${clr}">${pct>=100?'✓ Meta alcanzada':`Faltan ${fI(metaSemanalDinamica()-v)}`}</div>
    </div>`;
  });
  const todos=[...ingM.map(i=>({...i,_t:'ingreso'})),...gasM.map(g=>({...g,_t:'gasto'}))].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(todos.length===0){h+=`<div style="text-align:center;padding:40px 0;color:#9B9B9B;font-style:italic">Sin movimientos este mes.</div>`;}
  else{
    h+=`<div class="card" style="padding:0;overflow:hidden">`;

      const meta=isG?todasCats().find(c=>c.id===item.categoria):FUENTES.find(f=>f.id===item.fuente);
      h+=`<div class="mrow">
        <div class="micn">${meta?.icon||'💰'}</div>
        <div class="minfo"><div class="mdesc">${esc(item.descripcion)}</div><div class="msub">${meta?.label} · ${item.fecha}</div></div>
        <span class="mamt" style="color:${isG?'#B83232':'#2D7A4F'}">${isG?'-':'+'}${f2(item.monto)}</span>
        <button class="mbtn be" onclick='abrirEdit(${JSON.stringify(item).replace(/'/g,"&#39;")})'>✏</button>
        <button class="mbtn bd" onclick="${isG?`eliminarGasto('${item.id}')`:`eliminarIngreso('${item.id}')`}">✕</button>
      </div>`;
    });
    h+=`</div>`;
    h+=`<div class="card"><div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><span style="color:#6B6B6B">Total ingresado</span><span style="color:#2D7A4F;font-weight:bold">${f2(tI)}</span></div><div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><span style="color:#6B6B6B">Total gastado</span><span style="color:#B83232;font-weight:bold">${f2(tG)}</span></div><hr class="dvdr"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:bold"><span>Balance</span><span style="color:${tI-tG>=0?'#2D7A4F':'#B83232'}">${f2(tI-tG)}</span></div></div>`;
  }
  h+=`<div style="height:8px"></div>`;
  return h;
}

// ── NAV ────────────────────────────────────────

// ── QUICK PANEL ────────────────────────────────

      ${ST.qAsignar?`<div class="deuda-assign">
        <div class="deuda-assign-title">¿A cuál deuda va parte de este ingreso?</div>

        <div class="ilabel">¿Cuánto va a la deuda?</div>

        <div class="ttab ${isG?'go':'off'}" onclick="ST.qTipo='gasto';ST.qAsignar=false;render()">💸  Gasto</div>
        <div class="ttab ${!isG?'io':'off'}" onclick="ST.qTipo='ingreso';render()">💵  Ingreso</div>

        <span class="msign ${isG?'r':'g'}">$</span>
        <input class="minp ${isG?'r':'g'}" id="qMonto" type="number" inputmode="decimal" placeholder="0.00" value="${ST.qMonto}" oninput="ST.qMonto=this.value" onkeydown="if(event.key==='Enter')guardarQ()">

// ── COOP DISTRIBUCIÓN ──────────────────────────
function rCoopDist(){
  const pendientes=DEUDAS_CFG.filter(d=>(d.total-(ST.deudas[d.id]?.pagado||0))>0);
  let totalDist=0;
  Object.values(ST.coopDistVals).forEach(v=>{totalDist+=parseFloat(v)||0;});
  const resto=3000-totalDist;
  const rows=pendientes.map(d=>`<div class="coop-drow">
    <span>${d.icon} ${d.label} <span style="font-size:10px;color:#9B9B9B">(${fI(d.total-(ST.deudas[d.id]?.pagado||0))})</span></span>
    <input type="number" inputmode="decimal" placeholder="0" value="${ST.coopDistVals[d.id]||''}" oninput="ST.coopDistVals['${d.id}']=this.value;document.getElementById('coopResto').textContent='Resto: '+('$'+(3000-(Object.values(ST.coopDistVals).reduce((s,v)=>s+(parseFloat(v)||0),0))).toLocaleString('en-US',{minimumFractionDigits:2}))">
  </div>`).join('');
  return`<div class="overlay">
    <div class="obg" onclick="ST.coopDistOpen=false;render()"></div>
    <div class="panel">
      <div class="dbar"></div>
      <div style="font-size:16px;font-weight:bold;margin-bottom:3px">🎉 ¡Recibiste $3,000 de la Cooperativa!</div>
      <div style="font-size:12px;color:#9B9B9B;margin-bottom:14px">¿Cómo los distribuyes entre las deudas?</div>
      <div class="coop-dist">
        <div class="coop-dist-title">Distribuir $3,000</div>
        <div class="coop-dist-sub">Escribe cuánto va a cada deuda. No tienes que usar todo.</div>
        ${rows}
        <div class="coop-resto" id="coopResto" style="color:${resto<0?'#B83232':'#2D7A4F'}">Resto: ${f2(resto)}</div>
      </div>
      <button class="bsave bg" onclick="confirmarCoopDist()">Confirmar Distribución</button>
    </div>
  </div>`;
}

    <input id="cfgFijo_${f.id}" type="number" value="${f.monto}">

    <span>${v.icon} ${esc(v.label)}${v.custom?' <span style="font-size:9px;color:#9B9B9B">(personalizado)</span>':''}</span>
    <input id="cfgVar_${v.id}" type="number" value="${v.limite}">

  </div>`).join('');

  return`<div class="overlay">
    <div class="obg" onclick="cerrarAjustes()"></div>
    <div class="panel">
      <div class="dbar"></div>
      <div style="font-size:16px;font-weight:bold;margin-bottom:12px">⚙️ Ajustes</div>

      <div class="slabel" style="margin-top:0">Deudas</div>
      ${dRows}
      <div class="deuda-assign" style="margin-bottom:14px">
        <div class="deuda-assign-title">+ Agregar nueva deuda</div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input class="inp" id="cfgNewDeudaIcon" placeholder="💵" style="width:55px;text-align:center;margin-bottom:0">

        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input class="inp" id="cfgNewDeudaTotal" type="number" placeholder="Total $" style="margin-bottom:0">
          <input class="inp" id="cfgNewDeudaMin" type="number" placeholder="Mínimo/mes $" style="margin-bottom:0">
        </div>
        <button class="bsave ba" style="padding:9px;font-size:13px" onclick="agregarDeudaCustom()">+ Agregar deuda</button>

      <div class="slabel">Gastos Fijos (mensual)</div>

        <div class="deuda-assign-title">+ Agregar nuevo gasto fijo</div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input class="inp" id="cfgNewFijoIcon" placeholder="💵" style="width:55px;text-align:center;margin-bottom:0">
          <input class="inp" id="cfgNewFijoLabel" placeholder="Nombre" style="margin-bottom:0">
          <input class="inp" id="cfgNewFijoMonto" type="number" placeholder="Monto $" style="margin-bottom:0">

      <div class="slabel">Gastos Variables (límite mensual)</div>
      <div class="card">${vRows}</div>
      <div class="deuda-assign" style="margin-bottom:14px">
        <div class="deuda-assign-title">+ Agregar nuevo gasto variable</div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input class="inp" id="cfgNewVarIcon" placeholder="💵" style="width:55px;text-align:center;margin-bottom:0">
          <input class="inp" id="cfgNewVarLabel" placeholder="Nombre" style="margin-bottom:0">

    </div>
  </div>`;
}

// ══════════════════════════════════════════════
// HANDLERS
// ══════════════════════════════════════════════
function openQ(){ST.qOpen=true;ST.qErr='';render();setTimeout(()=>document.getElementById('qMonto')?.focus(),100);}
function closeQ(){ST.qOpen=false;ST.qMonto='';ST.qDesc='';ST.qErr='';ST.qAsignar=false;ST.qDeudaMonto='';render();}

function abrirAjustes(){ST.ajOpen=true;render();}
function cerrarAjustes(){ST.ajOpen=false;render();}

function guardarQ(){
  const monto=parseFloat(ST.qMonto);
  if(!monto||monto<=0){ST.qErr='Ingresa un monto válido.';render();return;}
  const isG=ST.qTipo==='gasto';
  const desc=ST.qDesc.trim()||(isG?(catsRapidas().find(c=>c.id===ST.qCat)?.label||'Gasto'):(FUENTES.find(f=>f.id===ST.qFuente)?.label||'Ingreso'));
  const dM=ST.qAsignar?parseFloat(ST.qDeudaMonto)||0:0;
  const dId=ST.qAsignar?ST.qDeudaId:null;
  ST.qMonto='';ST.qDesc='';ST.qErr='';ST.qOpen=false;ST.qAsignar=false;ST.qDeudaMonto='';
  if(isG)agregarGasto(desc,monto,ST.qCat,HOY());
  else agregarIngreso(desc,monto,ST.qFuente,HOY(),dId,dM);
}

function abrirDepositoInv(id){ST.invId=id;ST.invMonto='';ST.invDesc='';ST.invErr='';ST.invOpen=true;render();}
function guardarDepositoInv(){
  const monto=parseFloat(document.getElementById('invMonto')?.value||ST.invMonto);
  const desc=(document.getElementById('invDesc')?.value||ST.invDesc).trim();
  if(!monto||monto<=0){ST.invErr='Monto inválido.';render();return;}
  ST.invOpen=false;
  depositarInversion(ST.invId,monto,desc,HOY());
}

function abrirPagoDeuda(id){ST.pdDeudaId=id;ST.pdMonto='';ST.pdDesc='';ST.pdErr='';ST.pdOpen=true;render();}
function guardarPagoDeuda(){
  const monto=parseFloat(document.getElementById('pdMonto')?.value||ST.pdMonto);
  const desc=(document.getElementById('pdDesc')?.value||ST.pdDesc).trim();
  if(!monto||monto<=0){ST.pdErr='Monto inválido.';render();return;}
  ST.pdOpen=false;
  pagarDeudaDirecto(ST.pdDeudaId,monto,desc,HOY());
}

function abrirEdit(item){
  ST.eItem=item;ST.eTipo=item._t;
  ST.eDesc=item.descripcion;ST.eMonto=String(item.monto);
  ST.eCat=item.categoria||'comida_fuera';ST.eFuente=item.fuente||'quintecars';
  ST.eFecha=item.fecha;ST.eErr='';ST.eOpen=true;render();
}
function cerrarEdit(){ST.eOpen=false;ST.eItem=null;render();}
function guardarEdit(){
  const monto=parseFloat(document.getElementById('eMonto')?.value||ST.eMonto);
  const desc=(document.getElementById('eDesc')?.value||ST.eDesc).trim();
  const fecha=document.getElementById('eFecha')?.value||ST.eFecha;
  if(!desc){ST.eErr='Escribe una descripción.';render();return;}
  if(!monto||monto<=0){ST.eErr='Monto inválido.';render();return;}
  if(fecha>HOY()){ST.eErr='La fecha no puede ser futura.';render();return;}
  if(ST.eTipo==='gasto')editarGasto(ST.eItem.id,desc,monto,ST.eCat,fecha);
  else editarIngreso(ST.eItem.id,desc,monto,ST.eFuente,fecha);
  cerrarEdit();
}

function registrarSemCoop(){
  if(ST.coop.semanas>=9){
    actualizarCoop({ciclo:ST.coop.ciclo+1,semanas:0,pagos:ST.coop.pagos+1});
    ST.coopDistVals={};ST.coopDistOpen=true;render();
  } else {
    actualizarCoop({...ST.coop,semanas:ST.coop.semanas+1});
    showToast(`Semana ${ST.coop.semanas+1} registrada`);
  }
}
function deshacerCoop(){if(ST.coop.semanas>0)actualizarCoop({...ST.coop,semanas:ST.coop.semanas-1});}
function confirmarCoopDist(){ST.coopDistOpen=false;distribuirCoop(ST.coopDistVals);}

window.addEventListener('online', ()=>{
  ST.online=true;render();
  if(ST.syncCode){if(pendingSync)reintentarSync();else loadData();}
});
window.addEventListener('offline',()=>{ST.online=false;render();});
setInterval(()=>{if(pendingSync&&ST.online)reintentarSync();},20000);

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
(function init(){
  const ready=initSB();
  if(ST.syncCode){
    loadCache();render();
    if(ready){
      if(pendingSync){
        // hay cambios locales que nunca llegaron a Supabase: los subimos antes de bajar nada
        saveData().then(ok=>{if(ok)showToast('✓ Cambios pendientes sincronizados','gr');render();subChanges();});
      } else {
        loadData().then(()=>subChanges());
      }
    }
  } else {render();}
})();
</script>
